# Pinned toolchain for reproducible builds (web bundle digests depend on the exact rustc).
# Bump deliberately, together with packaging/web/toolchain.lock, and re-run the
# reproducibility workflow (.github/workflows/web-repro.yml).
[toolchain]
channel = "1.99.1"
profile = "minimal"
components = ["clippy", "rustfmt"]
targets = ["wasm32-unknown-unknown"]
